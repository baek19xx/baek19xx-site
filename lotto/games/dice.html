<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주사위 굴리기 - Lux Lotto Studio</title>
  <meta name="description" content="1개부터 6개까지 원하는 개수만큼 주사위를 굴려보세요." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WKK1PHMNVP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-WKK1PHMNVP');
  </script>
  <link rel="stylesheet" href="./games-common.css" />
  <script src="./games-common.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../">Lux Lotto Studio</a>
      <nav class="nav-links">
        <a href="../">홈</a>
        <a href="./">게임 목록</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="game-container">
      <h1 class="game-title">주사위 굴리기</h1>
      <p class="game-desc">주사위 개수를 선택하고 굴려보세요.</p>
      <label for="diceCount" style="display:inline-block; margin-right:0.5rem;">주사위 개수:</label>
      <select id="diceCount" style="padding:0.5rem; font-size:1rem; border-radius:0.5rem; border:2px solid #e5e7eb;">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
      </select>
      <br /><br />
      <button id="rollBtn" class="btn">주사위 굴리기</button>
      <div id="diceArea" class="dice-area"></div>
      <div id="result" class="result-box" style="min-height:auto;">주사위를 굴려주세요</div>
      <p class="stats" id="stats"></p>
    </div>
    <a class="back-link" href="./">← 게임 목록으로</a>
  </main>

  <footer>
    <p>&copy; 2026 Lux Lotto Studio. All rights reserved.</p>
  </footer>

  <script>
    const rollBtn = document.getElementById('rollBtn');
    const diceCount = document.getElementById('diceCount');
    const diceArea = document.getElementById('diceArea');
    const result = document.getElementById('result');
    const stats = document.getElementById('stats');

    const faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    function updateStats() {
      if (!window.MiniGame) return;
      const counts = window.MiniGame.getPlayCounts();
      const mine = counts.find((c) => c.game === 'dice');
      stats.textContent = mine ? `총 플레이 횟수: ${mine.plays}회` : '';
    }

    rollBtn.addEventListener('click', () => {
      if (window.MiniGame) window.MiniGame.track('dice', 'play');
      const count = parseInt(diceCount.value, 10) || 1;
      diceArea.innerHTML = '';
      let total = 0;
      for (let i = 0; i < count; i++) {
        const value = Math.floor(Math.random() * 6) + 1;
        total += value;
        const die = document.createElement('div');
        die.className = 'die';
        die.textContent = faces[value - 1];
        diceArea.appendChild(die);
      }
      result.textContent = `주사위 합계: ${total}`;
      if (window.MiniGame) {
        window.MiniGame.track('dice', 'result', { result: `sum_${total}`, dice_count: count });
      }
      updateStats();
    });

    updateStats();
  </script>
</body>
</html>
