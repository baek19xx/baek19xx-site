<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보 - Lux Lotto Studio</title>
  <meta name="description" content="컴퓨터와 가위바위보를 해보세요." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WKK1PHMNVP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-WKK1PHMNVP');
  </script>
  <link rel="stylesheet" href="./games-common.css" />
  <script src="./games-common.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="../">Lux Lotto Studio</a>
      <nav class="nav-links">
        <a href="../">홈</a>
        <a href="./">게임 목록</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="game-container">
      <h1 class="game-title">가위바위보</h1>
      <p class="game-desc">아래에서 하나를 선택하면 컴퓨터와 승부합니다.</p>
      <div class="choice-area">
        <button class="choice" data-choice="scissors" title="가위">✌️</button>
        <button class="choice" data-choice="rock" title="바위">✊</button>
        <button class="choice" data-choice="paper" title="보">🖐️</button>
      </div>
      <div id="result" class="result-box">선택해주세요</div>
      <p class="stats" id="stats"></p>
    </div>
    <a class="back-link" href="./">← 게임 목록으로</a>
  </main>

  <footer>
    <p>&copy; 2026 Lux Lotto Studio. All rights reserved.</p>
  </footer>

  <script>
    const choices = {
      rock: { ko: '바위', beats: 'scissors', emoji: '✊' },
      paper: { ko: '보', beats: 'rock', emoji: '🖐️' },
      scissors: { ko: '가위', beats: 'paper', emoji: '✌️' },
    };

    const resultBox = document.getElementById('result');
    const stats = document.getElementById('stats');
    const choiceBtns = document.querySelectorAll('.choice');

    function updateStats() {
      if (!window.MiniGame) return;
      const counts = window.MiniGame.getPlayCounts();
      const mine = counts.find((c) => c.game === 'rock-paper-scissors');
      stats.textContent = mine ? `총 플레이 횟수: ${mine.plays}회` : '';
    }

    function judge(user, computer) {
      if (user === computer) return 'draw';
      if (choices[user].beats === computer) return 'win';
      return 'lose';
    }

    choiceBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        if (window.MiniGame) window.MiniGame.track('rock-paper-scissors', 'play');
        const user = btn.dataset.choice;
        const computer = Object.keys(choices)[Math.floor(Math.random() * 3)];
        const outcome = judge(user, computer);

        const resultText = {
          win: '이겼습니다! 🎉',
          lose: '졌습니다. 😅',
          draw: '비겼습니다. 🤝',
        };

        resultBox.innerHTML = `
          <div>나: ${choices[user].emoji} ${choices[user].ko}</div>
          <div>컴퓨터: ${choices[computer].emoji} ${choices[computer].ko}</div>
          <div style="margin-top:0.5rem;">${resultText[outcome]}</div>
        `;

        if (window.MiniGame) {
          window.MiniGame.track('rock-paper-scissors', 'result', { result: outcome });
        }
        updateStats();
      });
    });

    updateStats();
  </script>
</body>
</html>
